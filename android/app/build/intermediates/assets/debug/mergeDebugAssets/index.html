<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <link rel="icon" href="data:," />
    <meta name="theme-color" content="#171044" />
    <title>方块出逃</title>
    <style>
      :root {
        color-scheme: dark;
        --color-escape-safe-top: env(safe-area-inset-top, 0px);
        --color-escape-safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #100b37; }
      body { display: grid; place-items: center; touch-action: none; overscroll-behavior: none; }
      /* 720×1584 is the authored frame. Nearby portrait ratios fill the screen;
         only materially wider devices receive side gutters. */
      canvas { display: block; width: min(100vw, calc(100vh * 0.461)); height: min(100vh, calc(100vw * 2.2)); max-width: 100vw; max-height: 100vh; box-shadow: 0 0 80px #050313; touch-action: none; }
      #startup-status { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; color: #fff; background: #100b37; font: 16px/1.6 sans-serif; }
      #startup-status[hidden] { display: none; }
      #startup-status section { width: 100%; max-width: 420px; }
      #startup-status h1 { font-size: 24px; }
      #startup-status button { padding: 12px 24px; border: 0; border-radius: 12px; color: #fff; background: #7354d9; font: inherit; }
      #startup-details { overflow-wrap: anywhere; word-break: break-word; white-space: pre-wrap; font-size: 12px; color: #c9c1e6; }
    </style>
    <script type="module" crossorigin src="./assets/game-1Ejrob0r.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/PuzzleModel-BJNQx39z.js">
  </head>
  <body>
    <div id="startup-status" role="status">
      <section>
        <h1 id="startup-title">正在启动方块出逃</h1>
        <p id="startup-message">首次打开需要加载游戏资源，请稍候。</p>
        <button id="startup-retry" type="button" hidden>重新打开</button>
        <details id="startup-diagnostics" hidden><summary>问题详情</summary><pre id="startup-details"></pre></details>
        <noscript>请启用 JavaScript，或更新手机的 Android System WebView 后重试。</noscript>
      </section>
    </div>
    <script src="./startup-guard.js"></script>
  </body>
</html>
