plugins {
    id "com.android.application"
}

// Keep the long-lived release key and its passwords outside the repository.
def releaseSigningFile = file(System.getenv("BLOCKOUT_RELEASE_SIGNING_PROPERTIES")
        ?: "${System.getProperty('user.home')}/.android/blockout-release/signing.properties")
def releaseSigning = new Properties()
if (releaseSigningFile.isFile()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}
def hasReleaseSigning = ["storeFile", "storePassword", "keyAlias", "keyPassword"].every {
    releaseSigning.getProperty(it)?.trim()
}

android {
    namespace "com.blockout.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.blockout.app"
        minSdk 23
        targetSdk 35
        versionCode 8
        versionName "0.1.7"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseSigning.getProperty("storeFile"))
                storePassword releaseSigning.getProperty("storePassword")
                keyAlias releaseSigning.getProperty("keyAlias")
                keyPassword releaseSigning.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    sourceSets {
        main {
            assets.srcDirs = [providers.gradleProperty("webAssetsDir").getOrElse("../../dist")]
        }
    }
}

tasks.configureEach {
    if (name == "preReleaseBuild") {
        doFirst {
            if (!hasReleaseSigning) {
                throw new GradleException("Release signing is missing. Configure BLOCKOUT_RELEASE_SIGNING_PROPERTIES or ~/.android/blockout-release/signing.properties; no debug-key fallback is allowed.")
            }
        }
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
